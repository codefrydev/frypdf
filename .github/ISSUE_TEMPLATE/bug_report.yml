name: Bug Report
description: Report something that isn't working as expected in FryPDF
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open FryPDF
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FryPDF version
      placeholder: e.g. v0.0.7 (see sidebar footer or Settings > About)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      render: shell
  - type: checkboxes
    id: pii
    attributes:
      label: Confirmation
      options:
        - label: I have not attached any real/sensitive documents — only synthetic/dummy sample files or screenshots
          required: true

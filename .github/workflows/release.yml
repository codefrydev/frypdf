name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build
        run: dotnet build -c Release
      - name: Run Test Suite
        run: dotnet test --no-build -c Release --verbosity normal

  build-windows:
    needs: [determine-version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish PdfEditorApp.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish/win-x64

      # ISCC.exe ships preinstalled on the windows-latest runner image at this path.
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss "/DMyAppVersion=$env:VERSION" "/DMyPublishDir=$env:GITHUB_WORKSPACE\publish\win-x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/FryPDF-Setup-${{ needs.determine-version.outputs.version }}.exe
          if-no-files-found: error

  build-macos:
    needs: [determine-version, test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish osx-arm64
        run: dotnet publish PdfEditorApp.csproj -c Release -r osx-arm64 --self-contained true -p:Version=$VERSION -o publish/osx-arm64

      - name: Assemble .app bundle
        run: |
          APP="FryPDF.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/osx-arm64/. "$APP/Contents/MacOS/"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist.template > "$APP/Contents/Info.plist"
          cp packaging/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          chmod +x "$APP/Contents/MacOS/PdfEditorApp"

      # Ad-hoc signing keeps the bundle identity stable across runs without full notarization
      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "FryPDF.app"

      - name: Create dmg
        run: |
          mkdir -p dmg-root
          cp -R "FryPDF.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "FryPDF" -srcfolder dmg-root -ov -format UDZO "FryPDF-$VERSION-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: FryPDF-${{ needs.determine-version.outputs.version }}-arm64.dmg
          if-no-files-found: error

  release:
    needs: [determine-version, test, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/windows-installer/FryPDF-Setup-$VERSION.exe" \
            "artifacts/macos-dmg/FryPDF-$VERSION-arm64.dmg" \
            --title "FryPDF $GITHUB_REF_NAME" \
            --generate-notes

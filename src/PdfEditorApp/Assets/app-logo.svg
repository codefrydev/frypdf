  <text x="512" y="726" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="bold" text-anchor="middle">FryPDF</text>
</svg>


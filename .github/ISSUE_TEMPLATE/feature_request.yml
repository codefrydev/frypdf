name: Feature Request
description: Suggest a new feature, tool, or plugin for FryPDF
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that FryPDF doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas / Editing
        - Reader Mode
        - PDF Tools (merge/split/compress/etc.)
        - Forms & Signatures
        - AI / OCR
        - Plugin system
        - Packaging / Installers
        - Other
    validations:
      required: false
